<form id="frmMateria">
    <div class="card theme-secondary" style="min-width:700px;">
        <div class="card-header">
            <div class="d-flex">
                Administracion de Materias

                <div class="ms-auto">
                    <button data-form="materia" type="button" class="btn-close" aria-label="Close"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="row p-1">
                <div class="col-3 col-md-2">CODIGO</div>
                <div class="col-9 col-md-4">
                    <input type="text" class="form-control" id="txtCodigoMateria" name="txtCodigoMateria" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">NOMBRE</div>
                <div class="col-9 col-md-8">
                    <input type="text" class="form-control" id="txtNombreMateria" name="txtNombreMateria" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">UV</div>
                <div class="col-9 col-md-6">
                    <input type="number" class="form-control" id="txtUvMateria" name="txtUvMateria" />
                </div>
            </div>
        </div>
        <div class="card-footer fg-2">
            <div class="col-12 text-center">
                <input type="submit" class="btn btn-outline-primary" value="Guardar" />
                <input type="reset" class="btn btn-outline-warnig" value="Nuevo" />
                <input onclick="abrirVentana('busqueda_materia')" type="button" class="btn btn-outline-success" value="Buscar" />
            </div>
        </div>
    </div>
</form>
<script>
var accion = 'nuevo',
        idMateria = 0;
    frmMateria.addEventListener('submit', e => {
        e.preventDefault();
        guardarMateria();
    });

    frmMateria.addEventListener('reset', e => {
        e.preventDefault();
        nuevoMateria();
    });
    async function guardarMateria() {
        let datos = {
            codigo: txtCodigoMateria.value,
            nombre: txtNombreMateria.value,
            uv: parseInt(txtUvMateria.value),
        },
            url = 'https://localhost:44312/api/Materias',
            methood = 'POST';
        if (accion == 'modificar') {
            methood = 'PUT';
            url = `https://localhost:44312/api/Materias/${idMateria}`;
            datos.idMateria = idMateria;
        }
        const respuesta = await fetch(url, {
            method: (accion === 'modificar' ? 'PUT' : 'POST'),
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos)
        });

        const materia = await respuesta.text().then(texto => texto ? JSON.parse(texto) : {});
        if (respuesta.ok) {
            nuevoMateria();
            listarMaterias(txtBuscarMateria.value || '');
        }

    }

    function nuevoMateria() {
        accion = "nuevo";
        idMateria = 0;
        txtCodigoMateria.value = "";
        txtNombreMateria.value = "";
        txtUvMateria.value = "";
    }

    function modificarMateria(materia) {
        accion = "modificar";
        idMateria = materia.idMateria;
        txtCodigoMateria.value = materia.codigo;
        txtNombreMateria.value = materia.nombre;
        txtUvMateria.value = materia.uv;
    }
</script>
